/* ---- Ereignisse ---- */
const TAPSEL="[data-act],[data-tab],[data-ex],[data-go],[data-open],[data-rest],[data-addset],[data-delset],[data-swap],[data-alt],[data-takealt],[data-note],[data-m],[data-mm],[data-t],[data-h],[data-wk],[data-dehn],[data-figplay],[data-ovbg]";

/* Diagnose: merkt sich die letzten Ereignisse, damit ein Fehler am Gerät nachweisbar wird */
const DIAG=[];
function dlog(k,e,extra){
  if(DIAG.length>150) DIAG.shift();
  const el=e&&e.target&&e.target.nodeType===1?e.target:null;
  const btn=el?el.closest(TAPSEL):null;
  DIAG.push({k:k, t:Date.now()%10000000,
    tag:el?el.tagName:"-", cls:el?String(el.className||"").slice(0,30):"",
    btn:btn?JSON.stringify(btn.dataset).slice(0,50):"-",
    pt:(e&&e.pointerType)||"", x:extra||""});
}
["touchstart","touchend","pointerdown","pointerup","click"].forEach(k=>{
  document.addEventListener(k,e=>dlog(k,e),{passive:true,capture:true});
});
window.addEventListener("error",ev=>{
  dlog("JSFEHLER",{target:null},String(ev.message||"").slice(0,90)+" @"+(ev.lineno||"?"));
});

/* Jeder Knopf bekommt eigene Zuhörer – ohne Umweg über das Dokument */
/* Eingabefelder, Links und Beschriftungen gehören dem Browser – dort nichts abfangen */
function tapAllowed(el,ev){
  const t=ev.target;
  if(!t || t.nodeType!==1) return true;
  if(t!==el && t.closest && t.closest("input,textarea,select,label,a,summary,option")) return false;
  if(el.hasAttribute("data-ovbg") && t!==el) return false;   // nur der freie Rand schließt
  return true;
}
function bindTaps(root){
  (root||document).querySelectorAll(TAPSEL).forEach(el=>{
    if(el.__tb) return; el.__tb=true;
    let st=null;
    el.addEventListener("touchstart",ev=>{
      const c=ev.changedTouches&&ev.changedTouches[0];
      st=(c&&tapAllowed(el,ev))?{x:c.clientX,y:c.clientY,t:Date.now()}:null;
    },{passive:true});
    el.addEventListener("touchend",ev=>{
      const c=ev.changedTouches&&ev.changedTouches[0], p=st; st=null;
      if(!p||!c||!tapAllowed(el,ev)) return;
      if(Math.abs(c.clientX-p.x)>26||Math.abs(c.clientY-p.y)>26||Date.now()-p.t>1600) return;
      if(ev.cancelable) ev.preventDefault();
      ev.__done=true; dlog("TAP",ev,"touchend");
      handleTap(el,ev);
    },{passive:false});
    el.addEventListener("click",ev=>{
      if(ev.__done || !tapAllowed(el,ev)) return;
      ev.__done=true; dlog("TAP",ev,"click");
      handleTap(el,ev);
    });
  });
}

/* Auffangnetz, falls ein Knopf noch nicht angebunden war */
let tapGuard=0, tapStart=null;
document.addEventListener("pointerdown",e=>{
  tapStart = e.pointerType==="mouse" ? null : {x:e.clientX,y:e.clientY,t:Date.now()};
},{passive:true});
document.addEventListener("pointerup",e=>{
  const p=tapStart; tapStart=null;
  if(e.__done || !p || e.pointerType==="mouse") return;
  if(Math.abs(e.clientX-p.x)>26 || Math.abs(e.clientY-p.y)>26 || Date.now()-p.t>1600) return;
  if(e.target.closest("label,input,select,textarea,a,summary")) return;
  const t=e.target.closest(TAPSEL); if(!t || t.__tb) return;
  tapGuard=Date.now(); dlog("TAP",e,"pointerup-fallback");
  handleTap(t,e);
});
document.addEventListener("click",e=>{
  if(e.__done || Date.now()-tapGuard<600) return;
  const t=e.target.closest(TAPSEL); if(!t || t.__tb) return;
  dlog("TAP",e,"click-fallback");
  handleTap(t,e);
});
function handleTap(t,e){
  try{ handleTapInner(t,e); }
  catch(err){
    dlog("FEHLER",{target:t},String(err&&err.message||err).slice(0,90));
    toast("Fehler: "+String(err&&err.message||err).slice(0,60));
  }
}
function handleTapInner(t,e){
  const d=t.dataset;
  dlog("HANDLE",{target:t},JSON.stringify(d).slice(0,50));

  if(t.hasAttribute("data-ovbg") && t===e.target){ closeOverlay(); return; }
  if(d.tab){ go(d.tab); return; }
  if(d.go){ closeOverlay(); go(d.go); return; }
  if(d.figplay){ figPlay(d.figplay); return; }
  if(d.ex!==undefined && d.ex!==""){ showEx(d.ex); return; }
  if(d.dehn){ showDehn(d.dehn); return; }

  // Pausenuhr
  if(d.t==="30"){ addTimer(30); return; }
  if(d.t==="pause"){ pauseTimer(); return; }
  if(d.t==="stop"){ stopTimer(); return; }

  // Cardio-Modus
  if(d.mm){ measMode=d.mm; renderWerte(); wireCharts($("#v-werte")); return; }
  if(d.m){ const s=curSession(); if(s){ s.cardio.m=d.m; const c=CARDIO[s.phase].find(x=>x.m===d.m); if(c){ s.cardio.min=c.min; s.cardio.desc=c.d||""; } saveSession(s.id,true); renderSession(); } return; }
  if(d.h!==undefined){ $$("#a-int button").forEach(b=>b.setAttribute("aria-pressed",String(b===t))); return; }
  if(d.t && ["alle","Maschine","Kabelzug","Freigewicht","Körpergewicht"].includes(d.t)){ uebFilter.t=d.t; renderUeb(); return; }

  // Wochenoptionen

  const act=d.act;
  if(act==="closeov"){ closeOverlay(); return; }
  if(act==="settings"){ showSettings(); return; }
  if(act==="weekopts"){ showWeekOpts(); return; }
  if(act==="addmeasure"){ showMeasure(); return; }
  if(act==="addact"){ showAct(); return; }
  if(act==="export"){ doExport(); return; }
  if(act==="exportshow"){ showText("Protokoll als CSV", buildCsv()); return; }
  if(act==="backup"){ doBackup(); return; }
  if(act==="import"){ showImport(); return; }
  if(act==="impgo"){ const el=$("#imp-txt"); try{ applyImport(JSON.parse((el&&el.value)||"null")); }catch(e){ toast("Der Text ist kein gültiges JSON."); } return; }
  if(act==="bgon"||act==="bgoff"){ curSettings().bg=(act==="bgon"); saveSettings(true); showSettings(); toast(act==="bgon"?"Ton im Hintergrund: an":"Ton im Hintergrund: aus"); return; }
  if(act==="notifask"){ askNotif(); return; }
  if(act==="testrest"){ closeOverlay(); startTimer(10); toast("Testpause läuft: jetzt in eine andere App wechseln."); return; }
  if(act==="checkupdate"){ checkUpdate(); return; }
  if(act==="reload"){ location.reload(); return; }
  if(act==="diagsend"){ sendDiag(); return; }
  if(act==="diagshow"){ showText("Diagnose", DIAG.slice(-60).map(r=>[r.k,r.tag,r.cls,r.btn,r.pt,r.x].join(" | ")).join("\n")); return; }
  if(act==="measurehelp"){ closeOverlay(); go("wissen"); toast("Unter „Fortschritt messen“."); return; }
  if(act==="copytext"){
    const ta=$("#overlay textarea");
    if(ta && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>toast("Kopiert.")).catch(()=>{ta.select();toast("Markiert – mit Kopieren übernehmen.");});
    } else if(ta){ ta.select(); toast("Markiert – mit Kopieren übernehmen."); }
    return;
  }
  if(act==="savesettings"){
    curSettings();
    S.settings.start=$("#st-start").value||todayISO();
    S.settings.weekManual=clamp(+($("#st-week").value||0),0,13);
    S.settings.bw=nz($("#st-bw").value);
    S.settings.restBig=clamp(+($("#st-rb").value||120),30,300);
    S.settings.restSml=clamp(+($("#st-rs").value||90),30,300);
    saveSettings(true); closeOverlay(); render(); toast("Gespeichert.");
    return;
  }
  if(act==="savemeasure"){
    const id=uid("m");
    const kg=nz($("#m-kg").value), cm=nz($("#m-cm").value);
    if(kg==null&&cm==null){ toast("Gewicht oder Taille eintragen."); return; }
    S.measures[id]={id,date:$("#m-date").value||todayISO(),kg,cm,note:$("#m-note").value||"",upd:Date.now()};
    if(kg!=null && S.settings.bw==null){ curSettings().bw=kg; saveSettings(true); }
    saveRec("measures",id,true); closeOverlay(); render(); toast("Eingetragen.");
    return;
  }
  if(act==="saveact"){
    const id=uid("a"), min=nz($("#a-min").value);
    if(!min){ toast("Minuten eintragen."); return; }
    const date=$("#a-date").value||todayISO();
    const wk = S.settings.start ? clamp(Math.floor((dayMs(date)-dayMs(S.settings.start))/86400000/7)+1,1,13) : curWeek();
    const hard = $("#a-int button[aria-pressed='true']") && $("#a-int button[aria-pressed='true']").dataset.h==="1";
    S.activity[id]={id,date,min,hard:!!hard,kind:$("#a-kind").value||"Alltagsbewegung",week:wk,upd:Date.now()};
    saveRec("activity",id,true); closeOverlay(); render(); toast("Eingetragen.");
    return;
  }
  if(act==="delmeasure"){ delDoc("measures",d.id); render(); return; }
  if(act==="delact"){ delDoc("activity",d.id); render(); return; }
  if(act==="newblock"){
    curSettings();
    S.settings.start=todayISO(); S.settings.weekManual=0; S.settings.two={}; S.settings.deload={};
    saveSettings(true); render(); toast("Neuer Block ab heute.");
    return;
  }
  if(act==="resetall"){ showConfirm("Alle Daten löschen","Einheiten, Körperwerte und Einstellungen werden gelöscht. Das lässt sich nicht rückgängig machen.","Endgültig löschen","resetconfirm"); return; }
  if(act==="resetconfirm"){
    Object.keys(S.sessions).forEach(id=>delDoc("sessions",id));
    Object.keys(S.measures).forEach(id=>delDoc("measures",id));
    Object.keys(S.activity).forEach(id=>delDoc("activity",id));
    S.settings=Object.assign({},DEF_SETTINGS,{start:todayISO()}); saveSettings(true);
    openSessionId=null; renderSession(); closeOverlay(); render(); toast("Alles gelöscht.");
    return;
  }

  // Einheit
  if(act==="start"){
    const w=curWeek(); if(w>12&&!S.settings.weekManual){ /* weiter trainieren erlaubt */ }
    openSessionId=makeSession(d.plan, Math.min(w,12)); renderSession(); render(); wakeOn(); window.scrollTo(0,0); return;
  }
  if(act==="resume"){ const o=openSession(); if(o){ openSessionId=o.id; renderSession(); wakeOn(); window.scrollTo(0,0); } return; }
  if(d.open){ openSessionId=d.open; renderSession(); window.scrollTo(0,0); return; }
  if(act==="closesession"){ openSessionId=null; stopTimer(); wakeOff(); renderSession(); render(); window.scrollTo(0,0); return; }
  if(act==="finish"){
    const s=curSession(); if(!s) return;
    const anyset=(s.items||[]).some(i=>i.sets.some(x=>x.d));
    if(!anyset){ toast("Noch kein Satz abgehakt."); return; }
    s.done=true; s.finished=Date.now(); saveSession(s.id,true);
    openSessionId=null; stopTimer(); wakeOff(); renderSession(); render();
    const sets=(s.items||[]).reduce((a,i)=>a+i.sets.filter(x=>x.d).length,0);
    toast(sets+" Sätze protokolliert. Gut gemacht.");
    return;
  }
  if(act==="reopen"){ const s=curSession(); if(s){ s.done=false; s.finished=null; saveSession(s.id,true); renderSession(); render(); } return; }
  if(act==="delsession"){ showConfirm("Einheit löschen","Diese Einheit samt aller Sätze wird gelöscht.","Löschen","delsessionconfirm",openSessionId); return; }
  if(act==="delsessionconfirm"){ delDoc("sessions",d.id); openSessionId=null; stopTimer(); closeOverlay(); renderSession(); render(); toast("Gelöscht."); return; }

  if(d.rest!==undefined){
    const s=S.sessions[openSessionId]; if(!s) return;
    const def=defOf(s,s.items[+d.rest]);
    startTimer(def.big?(S.settings.restBig||120):(S.settings.restSml||90));
    toast("Pause läuft."); return;
  }
  if(d.addset!==undefined){
    const s=curSession(); if(!s) return; const it=s.items[+d.addset];
    const last=it.sets[it.sets.length-1]||{};
    it.sets.push({w:last.w??null,r:null,rir:null,d:false}); saveSession(s.id,true); renderSession(); return;
  }
  if(d.delset!==undefined){
    const s=curSession(); if(!s) return; const it=s.items[+d.delset];
    if(it.sets.length>1) it.sets.pop(); saveSession(s.id,true); renderSession(); return;
  }
  if(d.alt!==undefined){ showAlt(+d.alt); return; }
  if(d.takealt){
    const parts=String(d.takealt).split("|"), s=curSession(); if(!s) return;
    const it=s.items[+parts[0]], nk=parts[1];
    if(EX[nk]){ it.k=nk; saveSession(s.id,true); closeOverlay(); renderSession();
      toast("Ersetzt durch "+((EX[nk]||{}).n||nk)+"."); }
    return;
  }
  if(d.swap!==undefined){
    const s=curSession(); if(!s) return; const it=s.items[+d.swap];
    const def=defOf(s,it), nk=otherOption(def,it.k);
    if(nk){ it.k=nk; saveSession(s.id,true); renderSession(); toast("Getauscht auf "+((EX[nk]||{}).n||nk)+"."); }
    return;
  }
  if(d.note!==undefined){ showNote(+d.note); return; }
  if(act==="savenote"){
    const s=S.sessions[openSessionId]; if(!s) return; const it=s.items[+d.i];
    saveNote(it.k, $("#n-txt").value||""); closeOverlay(); renderSession(); toast("Notiz gespeichert."); return;
  }
  if(act==="delnote"){
    const s=S.sessions[openSessionId]; if(!s) return; const it=s.items[+d.i];
    saveNote(it.k,""); closeOverlay(); renderSession(); toast("Notiz gelöscht."); return;
  }
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="exq"){ uebFilter.q=t.value; const pos=t.selectionStart; renderUeb(); const n=$("#exq"); if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}} return; }
  if(t.id==="progsel"){ progKey=t.value; renderWerte(); wireCharts($("#v-werte")); return; }
  if(t.dataset.f){ setField(t.dataset.f,t.value); return; }
  if(t.dataset.set){
    const s=curSession(); if(!s) return;
    const exc=t.closest(".exc"), row=t.closest(".setrow");
    const it=s.items[+exc.dataset.i], st=it.sets[+row.dataset.s];
    const k=t.dataset.set;
    st[k] = k==="rir" ? (t.value===""?null:+t.value) : nz(t.value);
    saveSession(s.id);
    return;
  }
});
/* Liefert die laufende Einheit immer als änderbare Kopie */
function curSession(){
  let s=S.sessions[openSessionId]; if(!s) return null;
  if(Object.isFrozen(s) || Object.isFrozen(s.items)){ s=clone(s); S.sessions[openSessionId]=s; }
  return s;
}
function setDone(ii,si,on){
  const s=curSession(); if(!s) return;
  const it=s.items[ii], st=it.sets[si], def=defOf(s,it);
  st.d=on;
  if(on){
    const rec=recFor(it.k,def,s.id,s.week,s.phase);
    if(st.r==null) st.r=rec.r;
    if(st.w==null) st.w=rec.w;
    startTimer(def.big?(S.settings.restBig||120):(S.settings.restSml||90));
  }
  saveSession(s.id,true); renderSession();
}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.classList && t.classList.contains("ck")){
    const dd=t.dataset;
    if(dd.tgl){ const s=curSession(); if(s){ s[dd.tgl].d=t.checked; saveSession(s.id,true); renderSession(); } return; }
    if(dd.done!==undefined){ const exc=t.closest(".exc"); if(exc) setDone(+exc.dataset.i,+dd.done,t.checked); return; }
    if(dd.wk){ const w=curWeek(), cfg=curSettings();
      const bag = dd.wk==="two"?(cfg.two=clone(cfg.two||{})):(cfg.deload=clone(cfg.deload||{}));
      bag[w]=t.checked; saveSettings(true); render(); return; }
  }
  if(t.dataset.set==="rir"){
    const s=curSession(); if(!s) return;
    const exc=t.closest(".exc"), row=t.closest(".setrow");
    s.items[+exc.dataset.i].sets[+row.dataset.s].rir = t.value===""?null:+t.value;
    saveSession(s.id);
  }
  if(t.id==="progsel"){ progKey=t.value; renderWerte(); wireCharts($("#v-werte")); }
});

/* Theme */
function applyTheme(){
  const v=lsTheme();
  if(v==="dark"||v==="light") document.documentElement.setAttribute("data-theme",v);
  else document.documentElement.removeAttribute("data-theme");
}
$("#btnTheme").addEventListener("click",()=>{
  const cur=lsTheme();
  const next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
  lsTheme(next); applyTheme();
  toast(next==="dark"?"Dunkel":next==="light"?"Hell":"Wie im System");
});
$("#btnSettings").addEventListener("click",showSettings);

/* ---- Offline-Speicher ---- */
let SWREG=null;
function regSW(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then(r=>{
    SWREG=r;
    r.addEventListener("updatefound",()=>{
      const nw=r.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed" && navigator.serviceWorker.controller)
          toast("Neue Fassung geladen – beim nächsten Start ist sie da.");
      });
    });
  }).catch(()=>{});
}
function checkUpdate(){
  if(!SWREG){ toast("Offline-Speicher ist hier nicht aktiv."); return; }
  SWREG.update().then(()=>toast("Geprüft."), ()=>toast("Keine Verbindung."));
}

/* ---- einmalige Übernahme der Daten aus der bisherigen Fassung ---- */
async function bootImport(){
  try{
    if(localStorage.getItem(LSKEY)) return;
    const r=await fetch("daten-start.json",{cache:"no-store"});
    if(!r.ok) return;
    const o=await r.json();
    if(o.settings) S.settings=Object.assign({},DEF_SETTINGS,o.settings);
    S.sessions=o.sessions||{}; S.measures=o.measures||{};
    S.activity=o.activity||{}; S.exnotes=o.exnotes||{}; S.tomb={};
    lsSave();
  }catch(e){}
}

/* Start */
(async function init(){
  await bootImport();
  lsLoad(); applyTheme();
  if(!S.settings.start){ curSettings().start=todayISO(); saveSettings(true); }
  try{ const t=localStorage.getItem("recomp.tab"); if(t) tab=t; }catch(e){}
  render();
  const o=openSession(); if(o && o.date===todayISO()){ openSessionId=o.id; renderSession(); }
  tRestore(); regSW();
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#overlay").innerHTML) closeOverlay(); else if(openSessionId){ openSessionId=null; stopTimer(); renderSession(); render(); } } });
})();
</script>
