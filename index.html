<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomp Zwölf Wochen</title>
<meta name="description" content="Trainingsplan, Protokoll und Pausenuhr für den 12-Wochen-Block.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EBEEF3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#EBEEF3;color:#14171E;overscroll-behavior-y:none;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){body{background:#0F1217;color:#EDF0F6}}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* Pausenuhr ausserhalb der laufenden Einheit: Leiste ueber der Tab-Leiste */
#timerBar:not(:empty){position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:41;pointer-events:none}
#timerBar .tbar{max-width:620px;margin:0 auto;pointer-events:auto;border-radius:12px;width:calc(100% - 16px);box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
</style>
</head>
<body>
<style>
/* Layout: eine Spalte, max 620px, fixe Tab-Leiste unten, Vollbild-Ansicht fuer die laufende Einheit, Bottom-Sheet fuer Details. */
:root{
  --bg:#EBEEF3; --card:#FFFFFF; --card2:#F5F7FA; --line:#D6DBE4; --line2:#E6EAF0;
  --fg:#14171E; --fg2:#4C5466; --fg3:#7A8395;
  --accent:#C8401C; --accent-ink:#8F2C12; --accent-soft:#FAE6DF;
  --cardio:#0C6B70; --cardio-soft:#DBEBEC;
  --good:#1C7347; --good-soft:#DCEDE3; --warn:#9C5B00; --warn-soft:#F7EBD6;
  --shadow:0 1px 2px rgba(20,23,30,.06), 0 6px 20px -12px rgba(20,23,30,.18);
  --r:14px; --r2:10px;
  --fdisp:"Archivo Expanded","Archivo","Helvetica Neue",Arial,sans-serif;
  --fui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --fbody:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --card:#171B22; --card2:#1D222B; --line:#2A313C; --line2:#222833;
  --fg:#EDF0F6; --fg2:#A6AFC0; --fg3:#78818F;
  --accent:#FF6B3D; --accent-ink:#FFB59C; --accent-soft:#34190F;
  --cardio:#45B8B8; --cardio-soft:#102E2E;
  --good:#4CC183; --good-soft:#13301F; --warn:#E0A33A; --warn-soft:#30250F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1217; --card:#171B22; --card2:#1D222B; --line:#2A313C; --line2:#222833;
  --fg:#EDF0F6; --fg2:#A6AFC0; --fg3:#78818F;
  --accent:#FF6B3D; --accent-ink:#FFB59C; --accent-soft:#34190F;
  --cardio:#45B8B8; --cardio-soft:#102E2E;
  --good:#4CC183; --good-soft:#13301F; --warn:#E0A33A; --warn-soft:#30250F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fbody);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3,h4{margin:0;font-family:var(--fdisp);font-weight:800;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:21px}
h3{font-size:17px;font-family:var(--fui);font-weight:700;letter-spacing:-.01em}
h4{font-size:15px;font-family:var(--fui);font-weight:700}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
small{font-size:12.5px}
.num{font-family:var(--fui);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--fui);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3)}
.mute{color:var(--fg2)}
.mute3{color:var(--fg3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.top .inner{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--fdisp);font-weight:800;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0}
.brand span{display:block;font-family:var(--fui);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg3)}
.iconbtn{appearance:none;background:var(--card);border:1px solid var(--line);color:var(--fg2);width:36px;height:36px;border-radius:10px;font-size:16px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.iconbtn:active{background:var(--card2)}

/* Karten */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.flat{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r2);padding:12px;box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.row.wr{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.sect{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* Knoepfe */
button{font-family:var(--fbody)}
.btn{appearance:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08);border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-family:var(--fui);font-weight:600;font-size:14px;padding:10px 14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;min-height:50px;font-size:16px;border-radius:13px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;background:transparent;border:0;color:var(--fg2);font-family:var(--fui);font-weight:600;font-size:13px;padding:8px 6px;border-radius:8px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}

/* Chips & Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--fui);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--card2);color:var(--fg2);border:1px solid var(--line2)}
.pill.ac{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.pill.cd{background:var(--cardio-soft);color:var(--cardio);border-color:transparent}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.wa{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stripe{width:4px;border-radius:4px;align-self:stretch;background:var(--accent);flex:0 0 4px}

/* Kennzahlen */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r2);padding:10px}
.tile .v{font-family:var(--fui);font-weight:700;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.tile .k{font-family:var(--fui);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3)}
.bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.cd i{background:var(--cardio)}
.bar.ok i{background:var(--good)}

/* Wochenpunkte */
.weekdots{display:flex;gap:4px;flex-wrap:wrap}
.weekdots b{width:100%;max-width:17px;height:17px;border-radius:5px;background:var(--line2);display:grid;place-items:center;font-family:var(--fui);font-size:9px;font-weight:700;color:var(--fg3);flex:1 1 13px}
.weekdots b.done{background:var(--accent);color:#fff}
.weekdots b.now{outline:2px solid var(--accent);outline-offset:1px;color:var(--accent);background:var(--accent-soft)}

/* Listen */
.list{display:flex;flex-direction:column;gap:1px;background:var(--line2);border-radius:var(--r2);overflow:hidden;border:1px solid var(--line2)}
.item{background:var(--card);touch-action:manipulation;padding:11px 12px;display:flex;align-items:center;gap:11px;text-align:left;border:0;width:100%;font:inherit;color:inherit;cursor:pointer}
.item:active{background:var(--card2)}
.item .grow{display:block}
.item .t{display:block;font-family:var(--fui);font-weight:600;font-size:14.5px;line-height:1.3}
.item .s{display:block;font-size:12.5px;color:var(--fg3);margin-top:1px}
.item .chev{color:var(--fg3);font-size:15px;flex:0 0 auto}
.idx{flex:0 0 24px;height:24px;border-radius:7px;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--fui);font-weight:700;font-size:11.5px;color:var(--fg3)}

/* Tabellen */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line2);border-radius:var(--r2)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:320px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-family:var(--fui);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);background:var(--card2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--fui);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Eingaben */
input,select,textarea{font-family:var(--fbody);font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:42px}
textarea{min-height:76px;resize:vertical;line-height:1.45}
input[type=number]{font-family:var(--fui);font-variant-numeric:tabular-nums;font-weight:600}
.field{display:block}
.field>span{display:block;font-family:var(--fui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{appearance:none;touch-action:manipulation;background:none;border:0;padding:9px 2px 8px;color:var(--fg3);display:grid;gap:2px;justify-items:center;cursor:pointer;font-family:var(--fui);font-size:10px;font-weight:700;letter-spacing:.03em}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-pressed="true"]{color:var(--accent)}

/* Einheit (Vollbild) */
.sheetwrap{position:relative;z-index:1;background:var(--bg);min-height:100vh}
body.insession>header.top,body.insession>.wrap,body.insession>nav.tabs{display:none!important}
.shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.shead .inner{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.step{display:flex;gap:10px;align-items:center;margin:20px 0 9px}
.step .no{flex:0 0 22px;height:22px;border-radius:999px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--fui);font-weight:700;font-size:11px}
.step h3{flex:1}

/* Satzzeilen */
.exc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.exc+.exc{margin-top:10px}
.exc.done{border-color:var(--good)}
.exch{display:flex;gap:10px;padding:12px;align-items:flex-start}
.exch .nm{font-family:var(--fui);font-weight:700;font-size:15px;line-height:1.25}
.exch .tg{font-size:12.5px;color:var(--fg3);margin-top:2px}
.sets{border-top:1px solid var(--line2)}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 62px 46px;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:0}
.setrow.on{background:var(--good-soft)}
.setrow .sn{font-family:var(--fui);font-weight:700;font-size:12px;color:var(--fg3);text-align:center}
.setrow input,.setrow select{min-height:38px;padding:6px 7px;text-align:center;font-size:15px}
.setrow select{padding-right:4px;text-align-last:center}
.cklab{display:block;min-height:44px;min-width:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.06);padding:1px;margin:0}
input.ck{-webkit-appearance:none;appearance:none;width:100%;height:42px;min-height:42px;margin:0;padding:0;border:1px solid var(--line);background-color:var(--card);background-repeat:no-repeat;background-position:center;background-size:16px 16px;border-radius:9px;cursor:pointer;touch-action:manipulation;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 8.5l3.2 3.2L13 5' fill='none' stroke='%23b9c0cc' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")}
input.ck:checked{background-color:var(--good);border-color:var(--good);background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 8.5l3.2 3.2L13 5' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")}
.minibox{flex:0 0 80px;text-align:center}
.minibox>span{display:block;font-family:var(--fui);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);margin-bottom:3px}
.minibox input{text-align:center}
.setfoot{display:flex;gap:8px;padding:9px 10px;border-top:1px solid var(--line2);background:var(--card2);flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--fg2);padding:8px 12px;background:var(--card2);border-top:1px solid var(--line2);display:flex;gap:7px}
.hint.up{color:var(--accent-ink);background:var(--accent-soft);border-top-color:transparent}
.colhead{display:grid;grid-template-columns:24px 1fr 1fr 62px 46px;gap:6px;padding:6px 10px 2px}
.colhead span{font-family:var(--fui);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);text-align:center}

/* Bottom-Sheet */
.ov{position:fixed;inset:0;z-index:70;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.ov .pane{background:var(--bg);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.ov .ph{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding:14px 16px 10px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start;z-index:2}
.ov .pb{padding:14px 16px}
.drag{width:34px;height:4px;border-radius:4px;background:var(--line);margin:7px auto 0}

/* Pausen-Leiste */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--fg);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.timer .inner{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.timer .t{font-family:var(--fui);font-weight:700;font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer .k{font-family:var(--fui);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.timer button{appearance:none;background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:9px;padding:8px 11px;font-family:var(--fui);font-weight:600;font-size:13px;min-height:36px;cursor:pointer}
.timer .prog{position:absolute;left:0;top:0;height:2px;background:var(--accent)}

/* Toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-family:var(--fui);font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:90vw;text-align:center}

/* Diagramme */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ax{fill:var(--fg3);font-family:var(--fui);font-size:9.5px;font-weight:600}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-family:var(--fui);font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .1s}
.chart .tip.on{opacity:1}
.barrow{display:grid;grid-template-columns:86px 1fr 46px;gap:8px;align-items:center;padding:5px 0}
.barrow .nm{font-family:var(--fui);font-size:12.5px;font-weight:600;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .tr{height:16px;background:var(--line2);border-radius:4px;position:relative;overflow:hidden}
.barrow .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0}
.barrow .tr i.low{background:var(--warn)}
.barrow .tr i.ok{background:var(--good)}
.barrow .tr u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg3);opacity:.55}
.barrow .vv{font-family:var(--fui);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--fg2)}

/* Details/Accordion */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
details+details{margin-top:8px}
summary{padding:12px;cursor:pointer;font-family:var(--fui);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--fg3);font-family:var(--fui);font-weight:700}

    add(K.head[0],K.head[1],SEG.headR+2);
    add(K.hand[0],K.hand[1],9); add(K.hand2[0],K.hand2[1],9);
  });
  if(F.arr){ const K=skel(F.a); const o=arrPt(K,F.arr), q=_a(o,F.arr.a,(F.arr.len||18)+6); add(q[0],q[1],4); }
  (F.g||[]).forEach(g=>{
    if(g.p&&g.k!=="cable") add(g.p[0],g.p[1],3);
    if(g.q) add(g.q[0],g.q[1],3);
    if(g.k==="cable") add(g.p[0],g.p[1],5);
    if(g.k==="wall") add(g.x,g.y0==null?20:g.y0,3);
    if(g.k==="floor") add(x0,FLOOR,2);
  });
  x0=Math.max(0,x0-6); y0=Math.max(0,y0-6); x1=Math.min(150,x1+6); y1=Math.min(122,y1+6);
  let w=x1-x0, hgt=y1-y0;
  const want=1.35;                       // Breite zu Höhe
  if(w/hgt<want){ const nw=hgt*want; x0-=(nw-w)/2; w=nw; }
  else { const nh=w/want; y0-=(nh-hgt)/2; hgt=nh; }
  return [Math.round(x0*10)/10,Math.round(y0*10)/10,Math.round(w*10)/10,Math.round(hgt*10)/10].join(" ");
}

const figTimers={};
function figPlay(id){
  const el=document.getElementById(id); if(!el) return;
  const key=el.dataset.fig, F=FIGS[key]; if(!F||!F.b) return;
  const g=el.querySelector(".figg"), btn=el.querySelector(".figbtn");
  if(figTimers[id]){ cancelAnimationFrame(figTimers[id]); delete figTimers[id];
    g.innerHTML=figBody(F.a,F.g,F); if(btn) btn.textContent="▶ Bewegung"; return; }
  if(btn) btn.textContent="■ Stopp";
  const t0=performance.now(), dur=2600;
  const step=now=>{
    const u=((now-t0)%dur)/dur;
    const tt=u<.5?u*2:(1-u)*2;
    const e=tt<.5?2*tt*tt:1-Math.pow(-2*tt+2,2)/2;
    g.innerHTML=figBody(lerpPose(F.a,F.b,e),F.g,F);
    figTimers[id]=requestAnimationFrame(step);
  };
  figTimers[id]=requestAnimationFrame(step);
}
function figStopAll(){ Object.keys(figTimers).forEach(id=>{cancelAnimationFrame(figTimers[id]); delete figTimers[id];}); }

<script>
"use strict";
/* ============================================================
   Zustand und Speicher
   ============================================================ */
const LSKEY = "recomp.v1";
const DEF_SETTINGS = { start:null, weekManual:0, bw:null, restBig:120, restSml:90,
                       two:{}, deload:{}, cue:true, bg:true, upd:0 };
const APPVERSION = "2026-11-10-2";
const S = { settings:Object.assign({},DEF_SETTINGS), sessions:{}, measures:{}, activity:{}, exnotes:{}, tomb:{} };
let DB=null, dbReady=false, readOnly=false, tab="heute", openSessionId=null, dbAttached=false;

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(p){return (p||"")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function todayISO(d){const x=d?new Date(d):new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function dayMs(iso){const p=String(iso).split("-");return new Date(+p[0],+p[1]-1,+p[2]).getTime();}
function fmtDate(iso){const d=new Date(dayMs(iso));return d.toLocaleDateString("de-AT",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function fmtDay(iso){const d=new Date(dayMs(iso));return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()];}
function nz(v){return v===""||v===null||v===undefined||Number.isNaN(v)?null:+v;}
function de(n,dec){return n==null?"–":Number(n).toLocaleString("de-AT",{minimumFractionDigits:dec||0,maximumFractionDigits:dec===undefined?1:dec});}

/* ---- localStorage ---- */
function lsSave(){
  try{localStorage.setItem(LSKEY,JSON.stringify({settings:S.settings,sessions:S.sessions,measures:S.measures,activity:S.activity,exnotes:S.exnotes,tomb:S.tomb}));}catch(e){}
}
function lsLoad(){
  try{
    const raw=localStorage.getItem(LSKEY); if(!raw) return;
    const o=JSON.parse(raw);
    if(o.settings) S.settings=Object.assign({},DEF_SETTINGS,o.settings);
    S.sessions=o.sessions||{}; S.measures=o.measures||{}; S.activity=o.activity||{}; S.exnotes=o.exnotes||{}; S.tomb=o.tomb||{};
  }catch(e){}
}
function lsTheme(v){try{ if(v===undefined) return localStorage.getItem("recomp.theme"); localStorage.setItem("recomp.theme",v);}catch(e){return null;}}

/* ---- db: Schreibwarteschlange, ein Schreibvorgang je Dokument ---- */
const qPending=new Map(), qTimer=new Map(), qFlight=new Set();
function flush(path){
  if(!DB || qFlight.has(path) || !qPending.has(path)) return;
  const body=qPending.get(path); qPending.delete(path); qFlight.add(path);
  const ref=DB.doc(path);
  const p = body===null ? ref.delete() : ref.set(body);
  p.catch(err=>{
    const c=err&&err.code;
    if(c==="invalid_argument" && !readOnly){ readOnly=true; toast("Kein Schreibrecht – Daten bleiben auf diesem Gerät."); }
    else if(c==="unavailable"){ qPending.set(path, qPending.has(path)?qPending.get(path):body); setTimeout(()=>flush(path), 2500+Math.random()*2000); }
    else if(c==="quota_exceeded"){ toast("Speicher voll – alte Einheiten löschen."); }
  }).finally(()=>{ qFlight.delete(path); if(qPending.has(path)) flush(path); });
}
function persist(path, body, delay){
  qPending.set(path, body);
  clearTimeout(qTimer.get(path));
  qTimer.set(path, setTimeout(()=>flush(path), delay===undefined?700:delay));
}
function stamp(o){ o.upd=Date.now(); return o; }

function noteFor(key){ const n=S.exnotes[key]; return (n&&n.text)||""; }
function saveNote(key,text){
  if(text && text.trim()){
    S.exnotes[key]={k:key, text:text.trim(), upd:Date.now()};
    lsSave(); persist("exnotes/"+key, clone(S.exnotes[key]), 0);
  }else{
    delete S.exnotes[key]; lsSave(); S.tomb["exnotes/"+key]=Date.now(); persist("exnotes/"+key, null, 0);
  }
}
function curSettings(){ if(Object.isFrozen(S.settings)) S.settings=clone(S.settings); return S.settings; }
function saveSettings(now){
  curSettings(); stamp(S.settings); lsSave(); persist("meta/settings", JSON.parse(JSON.stringify(S.settings)), now?0:700); }
function saveSession(id,now){
  let s=S.sessions[id]; if(!s) return;
  if(Object.isFrozen(s)){ s=clone(s); S.sessions[id]=s; }
  stamp(s); lsSave();
  persist("sessions/"+id, JSON.parse(JSON.stringify(s)), now?0:800);
}
function delDoc(kind,id){
  const path=kind+"/"+id; S.tomb[path]=Date.now();
  if(kind==="sessions") delete S.sessions[id];
  if(kind==="measures") delete S.measures[id];
  if(kind==="activity") delete S.activity[id];
  if(kind==="exnotes") delete S.exnotes[id];
  lsSave(); persist(path,null,0);
}
function saveRec(kind,id,now){
  const bag = kind==="measures"?S.measures:S.activity;
  if(!bag[id]) return;
  if(Object.isFrozen(bag[id])) bag[id]=clone(bag[id]);
  stamp(bag[id]); lsSave();
  persist(kind+"/"+id, JSON.parse(JSON.stringify(bag[id])), now?0:400);
}

/* ---- db anbinden ---- */
/* Dokumente aus der Datenbank kommen eingefroren an (Object.freeze).
   Sie dürfen nie direkt in den Zustand – sonst scheitert jede Änderung lautlos. */
function clone(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return o; } }
function mergeDoc(bag, id, data, path){
  const mine=bag[id];
  if(mine && (mine.upd||0) > (data.upd||0)) return false;   // lokal neuer
  bag[id]=clone(data); return true;
}
async function attachDb(){
  try{ DB = await window.claude.use("db"); }catch(e){ DB=null; }
  if(!DB){ dbReady=true; return; }
  dbReady=true; dbAttached=true;

  DB.doc("meta/settings").onSnapshot(sn=>{
    if(sn.exists){ const d=clone(sn.data()); if((d.upd||0) >= (S.settings.upd||0)) S.settings=Object.assign({},DEF_SETTINGS,d); }
    lsSave(); render();
  }, ()=>{});

  [["sessions",S.sessions],["measures",S.measures],["activity",S.activity],["exnotes",S.exnotes]].forEach(([k,bag])=>{
    DB.collection(k).onSnapshot(sn=>{
      let ch=false;
      sn.docChanges().forEach(c=>{
        const path=k+"/"+c.doc.id;
        if(c.type==="removed"){ if(bag[c.doc.id]){ delete bag[c.doc.id]; ch=true; } return; }
        const t=S.tomb[path]; const d=c.doc.data()||{};
        if(t && t>(d.upd||0)) return;
        if(mergeDoc(bag,c.doc.id,d,path)) ch=true;
      });
      if(ch){ lsSave(); render(); if(openSessionId) renderSession(); }
    }, ()=>{});
  });

  // einmalige Übertragung von Daten, die offline entstanden sind
  setTimeout(async ()=>{
    try{
      for(const k of ["sessions","measures","activity","exnotes"]){
        const bag = k==="sessions"?S.sessions : k==="measures"?S.measures : k==="activity"?S.activity : S.exnotes;
        const snap = await DB.collection(k).get();
        const have = new Set(snap.docs.map(d=>d.id));
        for(const id of Object.keys(bag)){
          if(!have.has(id) && !S.tomb[k+"/"+id]) persist(k+"/"+id, JSON.parse(JSON.stringify(bag[id])), 0);
        }
      }
      const m = await DB.doc("meta/settings").get();
      if(!m.exists && S.settings.start) persist("meta/settings", JSON.parse(JSON.stringify(S.settings)), 0);
    }catch(e){}
  }, 1500);
}

/* ============================================================
   Woche, Phase, Plan
   ============================================================ */
function curWeek(){
  if(S.settings.weekManual) return clamp(+S.settings.weekManual,1,13);
  if(!S.settings.start) return 1;
  const d=Math.floor((dayMs(todayISO())-dayMs(S.settings.start))/86400000);
  return clamp(Math.floor(d/7)+1,1,13);
}
function phaseOf(w){ return w<=4?1:w<=8?2:3; }
function planPattern(w){ return (w%2===1)?["A","B","A"]:["B","A","B"]; }
function sessionsOfWeek(w){
  return Object.values(S.sessions).filter(s=>s.week===w).sort((a,b)=>dayMs(a.date)-dayMs(b.date)||(a.started||0)-(b.started||0));
}
function doneOfWeek(w){ return sessionsOfWeek(w).filter(s=>s.done); }
function nextPlan(w){
  const n=doneOfWeek(w).length, pat=planPattern(w);
  return pat[Math.min(n,2)];
}
function openSession(){ return Object.values(S.sessions).find(s=>!s.done); }

function setCountFor(p, idx, week, phase, two, deload){
  /* Steht im Plan eine Spanne wie "2–3", wird das obere Ende voreingestellt. */
  const zahlen=String(p.s||"").match(/\d+/g);
  let sn = zahlen ? Math.max.apply(null, zahlen.map(Number)) : (p.sn||2);
  if(two && idx<3) sn=sn+1;
  if(deload) sn=Math.max(1,Math.ceil(sn/2));
  return sn;
}
function rirFor(p, week, phase){
  if(phase===2 && p.neu && week===5) return "3";
  if(phase===3 && p.neu) return "2–3 (neu: leicht starten)";
  if(phase===3 && !p.big && (p.k==="kh-curl"||p.k==="kabel-trizeps")) return "1–2, letzter Satz 0–1";
  return RIR_BY_WEEK(week);
}
function makeSession(plan, week){
  const phase=phaseOf(week), two=!!(S.settings.two||{})[week], deload=!!(S.settings.deload||{})[week];
  const items=PLAN[phase][plan].map((p,i)=>{
    const sn=setCountFor(p,i,week,phase,two,deload);
    return { k:p.k, pk:p.k, sets:Array.from({length:sn},()=>({w:null,r:null,rir:null,d:false})), note:"" };
  });
  const ci = Math.min(doneOfWeek(week).length,2);
  const c = CARDIO[phase][ci];
  const cplan = c.m;
  const id=uid("s");
  S.sessions[id]={ id, date:todayISO(), week, phase, plan, items,
    warm:{d:false,min:9}, cardio:{m:c.m,plan:cplan,min:two?30:c.min,d:false,desc:c.d||""},
    cool:{d:false}, notes:"", started:Date.now(), finished:null, done:false, upd:Date.now() };
  saveSession(id,true);
  return id;
}
function planItemDef(phase,plan,k){
  const arr=PLAN[phase][plan]||[];
  return arr.find(p=>p.k===k) || arr.find(p=>p.alt===k) || {};
}
/* Vorgaben kommen immer von der ursprünglichen Planübung, auch nach einem Tausch */
function defOf(s,it){ return planItemDef(s.phase,s.plan,it.pk||it.k); }
/* Gewichtsschritt des Geräts */
function stepOf(key){
  const t=(EX[key]||{}).t;
  return t==="Maschine"||t==="Kabelzug" ? 2.5 : t==="Freigewicht" ? 2 : 0;
}
/* Vorschlag für heute nach der doppelten Progression */
/* Ziel-RIR der Woche als Zahlenpaar */
function rirZiel(week, phase){
  const txt=rirFor({},week,phase);
  const z=String(txt).match(/\d+/g)||["2","3"];
  return {lo:+z[0], hi:+(z[1]||z[0]), txt:txt};
}
function recFor(key, def, exceptId, week, phase){
  const lo=def.rl?def.rl[0]:10, hi=def.rl?def.rl[1]:12, step=stepOf(key);
  const last=lastFor(key, exceptId);
  if(!last) return {w:null, r:lo, neu:true,
    why:"erste Einheit damit – so wählen, dass danach sicher noch 3–4 Wiederholungen gegangen wären"};
  const sets=last.sets.filter(x=>x.r!=null);
  const baseW=last.top.w;
  const allTop = sets.length>0 && sets.every(x=>(x.r||0)>=hi);

  /* Anstrengung des letzten Satzes – der sagt am meisten über die Reserve */
  const mitRir=last.sets.filter(x=>x.rir!=null);
  const letzter=last.sets[last.sets.length-1];
  const rir = (letzter && letzter.rir!=null) ? letzter.rir
            : (mitRir.length ? Math.min.apply(null, mitRir.map(x=>x.rir)) : null);
  const ziel = rirZiel(week||curWeek(), phase||phaseOf(week||curWeek()));
  const vielReserve = rir!=null && rir >= ziel.hi+2;
  const amLimit = rir!=null && rir===0;

  if(allTop && baseW!=null && step){
    let nw=Math.round((baseW*1.035)/step)*step;
    if(nw<=baseW) nw=baseW+step;
    if(vielReserve) nw=nw+step;
    return {w:nw, r:lo, up:true, rir:rir,
      why:"alle Sätze am oberen Ende"+(vielReserve?" und RIR "+rir+" bei Ziel "+ziel.txt+" – deshalb ein Schritt mehr":"")};
  }
  if(vielReserve && baseW!=null && step){
    const nw=baseW+step;
    return {w:nw, r:lo, up:true, rir:rir,
      why:"letztes Mal RIR "+rir+" bei Ziel "+ziel.txt+" – das war zu leicht"};
  }
  const lastR=sets.length?Math.max.apply(null,sets.map(x=>x.r||0)):lo;
  if(amLimit){
    return {w:baseW, r:Math.min(hi,lastR||lo), rir:rir,
      why:"letzter Satz ging bis ans Limit (RIR 0) – Gewicht halten und die Wiederholungen festigen"};
  }
  const r=Math.min(hi,(lastR||lo)+1);
  return {w:baseW, r:r, rir:rir, why:"eine Wiederholung mehr als letztes Mal"};
}
function otherOption(def,k){ return def.alt ? (k===def.alt?def.k:def.alt) : null; }

/* letzte Werte einer Übung */
function historyFor(key, exceptId){
  const out=[];
  Object.values(S.sessions).forEach(s=>{
    if(s.id===exceptId) return;
    (s.items||[]).forEach(it=>{
      if(it.k!==key) return;
      const done=(it.sets||[]).filter(x=>x.d && (x.w!=null||x.r!=null));
      if(!done.length) return;
      const top=done.reduce((a,b)=>((b.w||0)>(a.w||0)?b:a),done[0]);
      const vol=done.reduce((a,x)=>a+((x.w||0)*(x.r||0)),0);
      out.push({date:s.date,t:s.started||dayMs(s.date),sets:done,top,vol,sid:s.id});
    });
  });
  return out.sort((a,b)=>a.t-b.t);
}
function lastFor(key,exceptId){ const h=historyFor(key,exceptId); return h.length?h[h.length-1]:null; }
function progressHint(item, def){
  const done=(item.sets||[]).filter(x=>x.d);
  if(!def.rl || done.length<item.sets.length || !done.length) return null;
  const top=def.rl[1];
  if(done.every(x=>(x.r||0)>=top)) return "Alle Sätze am oberen Ende: nächstes Mal 2,5–5 % mehr (an der Maschine eine Platte) und wieder unten in der Spanne starten.";
  return null;
}
function stagnationHint(key){
  const h=historyFor(key); if(h.length<3) return null;
  const last3=h.slice(-3).map(x=>x.top.w||0);
  if(last3[0] && last3.every(v=>v===last3[0]))
    return "Dritte Einheit auf demselben Gewicht. Ein Wiederholungsziel tiefer gehen oder Schlaf und Eiweiß prüfen.";
  return null;
}

/* Wochenmittel der Körperwerte */
function mondayOf(iso){ const d=new Date(dayMs(iso)); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return todayISO(d); }
function meanPts(list, field){
  const g={};
  list.forEach(m=>{ if(m[field]==null) return; const k=mondayOf(m.date); (g[k]=g[k]||[]).push(+m[field]); });
  return Object.keys(g).sort().map(k=>({x:dayMs(k),iso:k,y:g[k].reduce((a,b)=>a+b,0)/g[k].length,n:g[k].length}));
}

/* Wochenbilanz */
function weekMinutes(w){
  let warm=0, light=0, hard=0;
  doneOfWeek(w).forEach(s=>{
    if(s.warm&&s.warm.d) warm+=(+s.warm.min||0);
    if(s.cardio&&s.cardio.d){ const m=+s.cardio.min||0; if(s.cardio.m==="intervalle") hard+=m; else light+=m; }
  });
  let aLight=0,aHard=0;
  Object.values(S.activity).forEach(a=>{ if(a.week===w){ const m=+a.min||0; if(a.hard) aHard+=m; else aLight+=m; } });
  const sum = warm+light+2*hard+aLight+2*aHard;
  return {warm, light, hard, aLight, aHard, sum};
}
function weekVolume(w){
  const v={}; MUSCLES.forEach(m=>v[m]=0);
  doneOfWeek(w).forEach(s=>(s.items||[]).forEach(it=>{
    const ex=EX[it.k]; if(!ex) return;
    const n=(it.sets||[]).filter(x=>x.d).length; if(!n) return;
    (ex.mg||[]).forEach((g,i)=>{ if(v[g]!==undefined) v[g]+= i===0?n:n*0.5; });
  }));
  return v;
}

/* ---- Liniendiagramm, eine Reihe ---- */
function lineChart(pts, opt){
  opt=opt||{};
  if(!pts.length) return '<div class="flat mute3">Noch keine Werte – unten eintragen.</div>';
  if(pts.length===1){
    return '<div class="flat"><span class="lbl">'+esc(opt.title||"")+'</span><div class="num" style="font-size:22px;font-weight:700">'+
      de(pts[0].y,opt.dec)+" "+esc(opt.unit||"")+'</div><small class="mute3">'+esc(fmtDate(pts[0].iso))+" · ab zwei Werten gibt es eine Linie</small></div>";
  }
  const W=320,H=148,pl=36,pr=8,ptp=10,pb=20;
  const ys=pts.map(p=>p.y), xs=pts.map(p=>p.x);
  let lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);
  const span=hi-lo, minSpan=opt.minSpan||1;
  if(span<minSpan){ const c=(lo+hi)/2; lo=c-minSpan/2; hi=c+minSpan/2; }
  const padY=(hi-lo)*0.14; const Y0=lo-padY, Y1=hi+padY;
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const sx=v=> pl+(x1===x0?(W-pl-pr)/2:(v-x0)/(x1-x0)*(W-pl-pr));
  const sy=v=> ptp+(1-(v-Y0)/(Y1-Y0))*(H-ptp-pb);
  const ticks=[lo,(lo+hi)/2,hi];
  let g="", lab="";
  ticks.forEach(t=>{ const y=sy(t).toFixed(1);
    g+='<line class="gl" x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'"/>';
    lab+='<text class="ax" x="'+(pl-5)+'" y="'+(+y+3).toFixed(1)+'" text-anchor="end">'+de(t,opt.dec)+"</text>";
  });
  const d=pts.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ");
  const area=d+" L"+sx(pts[pts.length-1].x).toFixed(1)+" "+sy(Y0).toFixed(1)+" L"+sx(pts[0].x).toFixed(1)+" "+sy(Y0).toFixed(1)+" Z";
  let dots=""; pts.forEach((p,i)=>{ dots+='<circle class="pt" r="'+(pts.length>18?3:4.5)+'" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'"/>';});
  const xa='<text class="ax" x="'+pl+'" y="'+(H-5)+'">'+esc(fmtDate(pts[0].iso))+'</text>'+
           '<text class="ax" x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end">'+esc(fmtDate(pts[pts.length-1].iso))+"</text>";
  const data=pts.map(p=>[sx(p.x).toFixed(1),sy(p.y).toFixed(1),de(p.y,opt.dec)+" "+(opt.unit||""),fmtDate(p.iso)].join("|")).join(";");
  return '<div class="chart" data-pts="'+esc(data)+'" data-w="'+W+'" data-h="'+H+'">'+
    (opt.title?'<span class="lbl">'+esc(opt.title)+(opt.unit?" in "+esc(opt.unit):"")+"</span>":"")+
    '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc((opt.title||"Verlauf")+": "+de(pts[0].y,opt.dec)+" bis "+de(pts[pts.length-1].y,opt.dec)+" "+(opt.unit||""))+'">'+
    g+'<path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'+dots+lab+xa+"</svg><div class='tip'></div></div>";
}
function wireCharts(root){
  $$(".chart[data-pts]",root).forEach(c=>{
    const svg=$("svg",c), tip=$(".tip",c);
    const pts=c.dataset.pts.split(";").map(s=>{const p=s.split("|");return {x:+p[0],y:+p[1],v:p[2],d:p[3]};});
    const W=+c.dataset.w;
    function move(e){
      const r=svg.getBoundingClientRect(); const cx=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*W;
      let best=pts[0],bd=1e9; pts.forEach(p=>{const d=Math.abs(p.x-cx); if(d<bd){bd=d;best=p;}});
      tip.textContent=best.d+" · "+best.v;
      tip.style.left=(best.x/W*r.width)+"px"; tip.style.top=(best.y/(+c.dataset.h)*r.height)+"px";
      tip.classList.add("on");
    }
    svg.addEventListener("pointermove",move);
    svg.addEventListener("pointerdown",move);
    svg.addEventListener("pointerleave",()=>tip.classList.remove("on"));
  });
}
function barRow(name,val,max,target,unit){
  const pct=clamp(val/max*100,0,100), tp=target?clamp(target/max*100,0,100):null;

  return '<div class="barrow"><span class="nm">'+esc(name)+'</span><span class="tr"><i class="'+cls+'" style="width:'+pct+'%"></i>'+
    (tp!=null?'<u style="left:'+tp+'%"></u>':"")+'</span><span class="vv">'+de(val,val%1?1:0)+esc(unit||"")+"</span></div>";
}

let uebFilter={q:"",t:"alle"};
function renderUeb(){
  let h='<div class="sect" style="margin-top:14px"><h2>Übungen</h2><small class="mute3">'+Object.keys(EX).length+" erklärt</small></div>";
  h+='<div class="card"><input id="exq" type="search" placeholder="Übung, Maschine oder Muskel suchen" value="'+esc(uebFilter.q)+'" autocomplete="off">'+
    '<div class="seg" style="margin-top:9px" id="extyp">';
  [["alle","Alle"],["Maschine","Maschine"],["Kabelzug","Kabel"],["Freigewicht","Frei"],["Körpergewicht","Körper"]].forEach(([v,l])=>{
    h+='<button data-t="'+v+'" aria-pressed="'+(uebFilter.t===v)+'">'+l+"</button>";
  });
  h+="</div></div>";

  const q=uebFilter.q.trim().toLowerCase();
  const keys=Object.keys(EX).filter(k=>{
    const e=EX[k];
    if(uebFilter.t!=="alle" && e.t!==uebFilter.t) return false;
    if(!q) return true;
    return (e.n+" "+e.en+" "+e.m+" "+(e.mg||[]).join(" ")+" "+e.find).toLowerCase().includes(q);
  });
  const byPhase={1:[],2:[],3:[]};
  keys.forEach(k=>{ (EX[k].ph||[]).forEach(p=>byPhase[p].push(k)); });
  [1,2,3].forEach(p=>{
    const list=byPhase[p]; if(!list.length) return;
    h+='<div class="sect"><h3>Phase '+p+" · "+esc(PHASES[p-1].t)+'</h3><small class="mute3">Woche '+esc(PHASES[p-1].w)+"</small></div>";
    h+='<div class="list">';
    list.forEach(k=>{
      const e=EX[k];
      h+='<button class="item" data-ex="'+esc(k)+'"><span class="grow"><span class="t">'+esc(e.n)+'</span><span class="s">'+
        esc(e.t+" · "+(e.mg||[]).join(", "))+'</span></span><span class="chev">›</span></button>';
    });
    h+="</div>";
  });
  if(!keys.length) h+='<div class="card mute3">Nichts gefunden. Suchbegriff löschen oder anderen Filter wählen.</div>';
  $("#v-ueb").innerHTML=h;
}

    "</tbody></table></div>"+(S.settings.bw?"<div class='flat' style='margin-top:10px'><span class='lbl'>Für "+de(S.settings.bw,1)+" kg Körpergewicht</span><div style='font-size:14px;margin-top:3px'>Eiweiß "+de(S.settings.bw*1.6,0)+"–"+de(S.settings.bw*2.2,0)+" g pro Tag, also etwa "+de(S.settings.bw*1.6/4,0)+"–"+de(S.settings.bw*2.2/4,0)+" g je Mahlzeit bei 4 Mahlzeiten.</div></div>":"<div class='flat' style='margin-top:10px'><button class='btn sm' data-act='settings'>Körpergewicht hinterlegen</button><small class='mute3' style='display:block;margin-top:6px'>Dann rechnet die App die Eiweißmenge aus.</small></div>")+"</div></details>";

  h+="<details><summary>Dehnen – wann, wo und wie</summary><div class='db'>"+
    "<h4 style='margin:6px 0 6px'>Vor Ort oder daheim?</h4><ul class='ticks'>"+
    "<li><b>Am besten gleich im Studio</b>, direkt nach dem Cardio: die Muskulatur ist warm, du bist ohnehin dort, und es kostet nur 3–5 Minuten. Drei bis vier Positionen zu je 30 Sekunden reichen.</li>"+
    "<li><b>Daheim ist genauso wirksam</b>, wenn es dir lieber ist. Beweglichkeit hängt an der Summe über die Woche, nicht am Zeitpunkt. Dann aber nicht eiskalt beginnen: nach der Dusche oder nach 5 Minuten Gehen.</li>"+
    "<li><b>Nicht statisch dehnen direkt vor dem Krafttraining.</b> Langes Halten senkt kurzfristig die Kraft. Vor dem Training ist das Aufwärmen plus Mobilisation zuständig, nach dem Training das Dehnen.</li>"+
    "<li><b>Zwei bis drei Mal pro Woche je Muskel</b> genügen für mehr Beweglichkeit. Wenn du nach jeder Einheit die Positionen zum jeweiligen Plan machst, bist du automatisch dort.</li>"+
    "</ul>"+
    "<h4 style='margin:14px 0 6px'>Wie intensiv</h4><ul class='ticks'>"+
    "<li>30 Sekunden ruhig halten, nicht federn, nicht wippen.</li>"+
    "<li>Intensität 6–7 von 10: deutliches Ziehen im Muskelbauch – kein Schmerz, kein Stechen, kein Kribbeln.</li>"+
    "<li>Weiteratmen. Mit jeder Ausatmung lässt die Spannung etwas nach, dann darfst du ein kleines Stück nachgeben.</li>"+
    "<li>Zwei Durchgänge je Seite sind besser als einer, mehr bringt kaum zusätzlichen Nutzen.</li>"+
    "<li>Gegen Muskelkater hilft Dehnen nicht messbar – es schadet aber auch nicht und fühlt sich angenehm an.</li>"+
    "</ul>"+
    "<h4 style='margin:14px 0 6px'>Die acht Positionen</h4>"+
    "<div class='list' style='margin-top:8px'>"+DEHN.map(d=>'<button class=\"item\" data-dehn=\"'+esc(d.k)+'\"><span class=\"grow\"><span class=\"t\">'+esc(d.n)+'</span><span class=\"s\">'+esc(d.z+" · "+d.hold)+'</span></span><span class=\"chev\">›</span></button>').join("")+"</div>"+
    "</div></details>";
  h+="<details><summary>Was die App aus deinen Eingaben macht</summary><div class='db'>"+
    "<p class='mute' style='font-size:14px'>Jede Zahl, die du einträgst, wird weiterverwendet – nichts ist reine Dokumentation.</p>"+
    "<div class='tw' style='margin-top:10px'><table><thead><tr><th>Eingabe</th><th>Wird verwendet für</th></tr></thead><tbody>"+
    "<tr><td><b>kg</b> und <b>Wdh</b></td><td>den Vorschlag für die nächste Einheit (doppelte Progression), den Hinweis bei drei gleichen Einheiten, die Verlaufskurve je Übung, die Gesamtlast und den CSV-Export</td></tr>"+
    "<tr><td><b>RIR</b></td><td>wie groß der nächste Schritt ausfällt: deutlich mehr Reserve als das Wochenziel → ein Schritt mehr Gewicht; letzter Satz bei 0 → Gewicht halten, erst die Wiederholungen festigen</td></tr>"+
    "<tr><td><b>Haken je Satz</b></td><td>harte Sätze je Muskelgruppe gegen den Richtwert 10, Fortschrittsbalken der Einheit</td></tr>"+
    "<tr><td><b>Aufwärm- und Cardio-Minuten</b></td><td>die Wochenbilanz gegen die 150 Minuten – Intervalle doppelt gezählt</td></tr>"+
    "<tr><td><b>Notiz je Übung</b></td><td>erscheint bei dieser Übung in jeder künftigen Einheit</td></tr>"+
    "<tr><td><b>Gewicht und Taille</b></td><td>Verlauf, Wochenmittel und der Vergleich zur Vorwoche mit Einordnung</td></tr>"+
    "<tr><td><b>Alltagsbewegung</b></td><td>fließt in dieselbe Wochenbilanz ein</td></tr>"+
    "</tbody></table></div>"+
    "<p class='mute' style='font-size:13.5px;margin-top:10px'>Deshalb lohnt sich der RIR: Ohne ihn weiß die App nur, <i>was</i> du geschafft hast – mit ihm auch, <b>wie schwer</b> es war. Zwölf Wiederholungen mit RIR 4 und zwölf mit RIR 0 sind dasselbe Ergebnis bei völlig verschiedener Anstrengung, und nur im zweiten Fall ist das Gewicht richtig gewählt.</p>"+
    "</div></details>";
  h+="<details><summary>Wenn es nicht vorangeht</summary><div class='db'><ul class='ticks'>"+
    "<li><b>Im Defizit:</b> Kraft halten ist bereits ein Erfolg.</li>"+
    "<li><b>Stagnation:</b> stagniert eine Übung 3 Einheiten lang, ein Wiederholungsziel tiefer gehen oder Schlaf und Eiweiß prüfen.</li>"+
    "<li><b>Lockere Woche:</b> wenn Woche 8 sich zäh anfühlt, eine Woche mit halber Satzzahl einlegen, dann Phase 3. In der App unter „Woche anpassen“.</li>"+
    "<li><b>Protokoll:</b> Gewichte und Wiederholungen mitschreiben – sonst ist Progression Raten. Genau dafür ist diese App da.</li>"+
    "</ul></div></details>";

  h+="<details><summary>Fortschritt messen – der Standard</summary><div class='db'>"+
    "<p class='mute' style='font-size:14px'>Vier Messgrößen, jede mit festen Regeln. Nur was immer gleich gemessen wird, lässt sich vergleichen.</p>"+
    "<h4 style='margin:12px 0 6px'>1. Gewicht</h4><ul class='ticks'>"+MESS_WIEGEN.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"+
    "<h4 style='margin:14px 0 6px'>2. Taille</h4><ul class='ticks'>"+MESS_TAILLE.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"+
    "<h4 style='margin:14px 0 6px'>3. Fotos</h4><ul class='ticks'><li>Alle 4 Wochen, morgens, gleiches Licht, gleicher Ort, gleiche Haltung.</li></ul>"+
    "<h4 style='margin:14px 0 6px'>4. Trainingsprotokoll</h4><ul class='ticks'><li>Mehr Gewicht oder mehr Wiederholungen bei gleicher RIR ist der verlässlichste Fortschrittsmesser – und der einzige, der dir sagt, ob die Muskulatur gehalten hat.</li></ul>"+
    "<h4 style='margin:14px 0 6px'>So liest du die Zahlen</h4><ul class='ticks'>"+MESS_LESEN.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"+
    "</div></details>";

  h+="<details><summary>Quellen</summary><div class='db'><ul class='ticks'>"+
    '<li><a href="https://www.gesundheit.gv.at/leben/bewegung/gesund-durch-sport/bewegungsempfehlungen-erwachsene" target="_blank" rel="noopener">Bewegungsempfehlungen für Erwachsene – gesundheit.gv.at</a> (Basis: Fonds Gesundes Österreich, Österreichische Bewegungsempfehlungen, Wissensband 17, 2020)</li>'+
    '<li><a href="https://www.gesundheit.gv.at/aktuelles/bewegungsempfehlungen-neu" target="_blank" rel="noopener">Österreichische Bewegungsempfehlungen neu – gesundheit.gv.at</a></li>'+
    "<li>Trainings- und Ernährungsrichtwerte (Volumen, RIR, Eiweiß, Concurrent Training) beruhen auf dem Konsens aktueller Meta-Analysen, u. a. Schoenfeld et al. 2017 (Trainingsvolumen), Morton et al. 2018 (Eiweiß), Wilson et al. 2012 (Kraft + Ausdauer kombiniert).</li>"+
    "</ul></div></details>";
  $("#v-wissen").innerHTML=h;
}

function renderSession(){
  const host=$("#sessionView");
  const keepScroll=window.scrollY||0;
  if(!openSessionId||!S.sessions[openSessionId]){ host.innerHTML=""; document.body.classList.remove("insession"); return; }
  document.body.classList.add("insession");
  const s=S.sessions[openSessionId];
  const c=CARDIO[s.phase];
  let h='<div class="sheetwrap"><div class="shead"><div class="inner">'+
    '<button class="iconbtn" data-act="closesession" aria-label="Schließen">‹</button>'+
    '<div class="grow"><div class="brand">Plan '+s.plan+'<span>Woche '+s.week+" · Phase "+s.phase+" · "+esc(fmtDate(s.date))+"</span></div></div>"+
    (s.done?'<span class="pill ok">fertig</span>':'<span class="num pill" id="elapsed">–</span>')+
    '</div><div id="timerSlot"></div></div>'+
    "<div class='wrap' style='padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))'>";

  // 1 Aufwärmen
  h+='<div class="step"><span class="no">1</span><h3>Aufwärmen</h3><small class="mute3">8–10 min</small></div>';
  h+='<div class="card"><div class="row"><label class="cklab" style="flex:0 0 46px"><input type="checkbox" class="ck" data-tgl="warm"'+(s.warm.d?" checked":"")+' aria-label="Aufwärmen erledigt"></label>'+
    '<div class="grow"><div class="num" style="font-weight:600">Rad oder Crosstrainer locker</div><small class="mute3">danach Hüfte, Schultern, Brustwirbelsäule mobilisieren</small></div>'+
    '<label class="minibox"><span>Minuten</span><input type="number" inputmode="numeric" min="0" max="30" value="'+(s.warm.min==null?"":s.warm.min)+'" data-f="warm.min" aria-label="Minuten aufgewärmt"></label></div>';
  h+='<small class="mute3" style="display:block;margin-top:8px">Haken = erledigt. Im Feld stehen die Minuten, die du dich aufgewärmt hast – 8–10 sind der Richtwert, voreingestellt sind 9. Die Minuten zählen in die Wochenbilanz unter Werte.</small>';
  h+='<details style="margin-top:10px"><summary>Mobilisation – so geht jede Übung</summary><div class="db">'+
    MOB.map(m=>'<div class="flat" style="margin-top:8px"><div class="spread"><h4>'+esc(m.n)+'</h4><span class="pill">'+esc(m.d)+'</span></div>'+
      '<small class="mute3" style="display:block;margin-top:2px">'+esc(m.g)+'</small>'+
      (m.fig?'<div style="margin-top:8px">'+figureHtml(m.fig,{alt:m.n,nocap:true})+"</div>":"")+
      '<ul class="ticks num" style="margin-top:8px">'+m.how.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul>'+
      '<small class="mute3" style="display:block;margin-top:8px">'+esc(m.w)+'</small></div>').join("")+
    '</div></details>';
  h+='<div id="wakeInfo" style="margin-top:9px"></div>';
  h+='<small class="mute3" style="display:block;margin-top:9px">Vor der ersten Übung 1–2 Aufwärmsätze mit ca. 50 % Gewicht.</small></div>';

  // 2 Kraft
  const totalSets=(s.items||[]).reduce((a,i)=>a+i.sets.length,0);
  const doneSets=(s.items||[]).reduce((a,i)=>a+i.sets.filter(x=>x.d).length,0);
  h+='<div class="step"><span class="no">2</span><h3>Krafttraining</h3><small class="mute3">'+doneSets+" / "+totalSets+" Sätze</small></div>";
  h+='<div class="bar" style="margin-bottom:10px"><i style="width:'+(totalSets?doneSets/totalSets*100:0)+'%"></i></div>';
  h+='<details style="margin-bottom:10px"><summary>Was bedeuten kg, Wdh und RIR?</summary><div class="db"><ul class="ticks">'+
    '<li><b>kg</b> – das Gewicht, das in diesem Satz eingestellt war. An der Maschine die Zahl am Stapel, bei Kurzhanteln das Gewicht einer Hantel.</li>'+
    '<li><b>Wdh</b> – die Wiederholungen, die du in diesem Satz sauber geschafft hast.</li>'+
    '<li><b>RIR</b> – Wiederholungen in Reserve: wie viele wären noch gegangen? 2 heißt, zwei wären noch drin gewesen. 0 heißt, es ging keine mehr.</li>'+
    '<li><b>Was die App damit macht:</b> kg und Wiederholungen bestimmen den Vorschlag fürs nächste Mal. Der RIR steuert, wie groß der Sprung ausfällt – war die Reserve deutlich größer als das Ziel, kommt ein Schritt mehr Gewicht; war der letzte Satz bei 0, bleibt das Gewicht und erst die Wiederholungen werden gefestigt.</li>'+
    '<li><b>Graue Zahlen</b> im Feld sind der Vorschlag für heute. Tippst du nur den Haken, übernimmt die App genau diese Werte – sonst eintippen und überschreiben.</li>'+
    '<li><b>Haken rechts</b> – Satz erledigt. Er startet automatisch die Pausenuhr, die oben in der Kopfzeile mitläuft.</li>'+'<li><b>⏱ Pause</b> unter jeder Übung startet die Uhr von Hand – mit der passenden Zeit für diese Übung.</li>'+
    '</ul></div></details>';

  const warmed={};
  (s.items||[]).forEach((it,ii)=>{
    const def=defOf(s,it)||{};
    const ex=EX[it.k]||{n:it.k};
    const allDone=it.sets.length&&it.sets.every(x=>x.d);
    const last=lastFor(it.k,s.id);
    const rec=recFor(it.k,def,s.id,s.week,s.phase);
    h+='<div class="exc'+(allDone?" done":"")+'" data-i="'+ii+'">';
    h+='<div class="exch"><span class="idx">'+(ii+1)+"</span>"+
      exTitleRow(it.k,def, esc((def.s||it.sets.length)+" Sätze · "+(def.r||"")+" Wdh · RIR "+rirFor(def,s.week,s.phase)))+
      '<button class="btn sm ghost" data-ex="'+esc(it.k)+'">Erklärung</button></div>';
    h+='<div class="hint'+(rec.up?" up":"")+'">'+(rec.up?"↑":"◎")+' <span><b>Vorschlag: '+
      (rec.w!=null?de(rec.w)+" kg × "+rec.r:rec.r+" Wiederholungen")+"</b> · "+esc(rec.why)+"</span></div>";
    const grp=WARMGRP[it.k];
    if(grp && !warmed[grp]){
      warmed[grp]=1;
      const st=stepOf(it.k)||2.5;
      const wUp = rec.w!=null ? de(Math.max(st, Math.round((rec.w*0.5)/st)*st))+" kg" : "deutlich weniger Gewicht";
      h+='<div class="hint">♨ <span><b>Erste '+esc(WARMNAME[grp])+' heute</b> – vorher 1–2 Aufwärmsätze mit '+
        (rec.w!=null?"ca. ":"")+wUp+", je 5–8 Wiederholungen. Zählen nicht mit.</span></div>";
    }
    if(def.neu) h+='<div class="hint">★ <span>Neu in dieser Phase – '+esc(def.ers||"erste Einheiten leicht, Technik vor Gewicht")+".</span></div>";
    h+='<div class="colhead"><span></span><span>kg</span><span>Wdh</span><span>RIR</span><span></span></div>';
    h+='<div class="sets">';
    it.sets.forEach((st,si)=>{
      h+='<div class="setrow'+(st.d?" on":"")+'" data-s="'+si+'">'+
        '<span class="sn">'+(si+1)+"</span>"+
        '<input type="number" inputmode="decimal" step="0.5" min="0" value="'+(st.w==null?"":st.w)+'" data-set="w" placeholder="'+(rec.w!=null?de(rec.w):"–")+'" aria-label="Gewicht Satz '+(si+1)+'">'+
        '<input type="number" inputmode="numeric" step="1" min="0" value="'+(st.r==null?"":st.r)+'" data-set="r" placeholder="'+rec.r+'" aria-label="Wiederholungen Satz '+(si+1)+'">'+
        '<select data-set="rir" aria-label="RIR Satz '+(si+1)+'"><option value="">RIR</option>'+
          [0,1,2,3,4,5].map(v=>'<option value="'+v+'"'+(String(st.rir)===String(v)?" selected":"")+">"+v+"</option>").join("")+"</select>"+
        '<label class="cklab"><input type="checkbox" class="ck" data-done="'+si+'"'+(st.d?" checked":"")+' aria-label="Satz '+(si+1)+' erledigt"></label></div>';
    });
    h+="</div>";
    if(last) h+='<div class="hint">↩ <span>Letztes Mal ('+esc(fmtDate(last.date))+"): "+
      last.sets.map(x=>(x.w!=null?de(x.w)+" × ":"")+de(x.r)+(x.rir!=null?" / RIR "+esc(x.rir):"")).join(" · ")+"</span></div>";
    const restS=(def.big?(S.settings.restBig||120):(S.settings.restSml||90));
  h+='<div class="setfoot"><button class="btn sm" data-rest="'+ii+'">⏱ Pause '+Math.floor(restS/60)+":"+String(restS%60).padStart(2,"0")+"</button>"+
    '<button class="btn sm" data-addset="'+ii+'">+ Satz</button>'+
       (it.sets.length>1?'<button class="btn sm ghost" data-delset="'+ii+'">− Satz</button>':"")+
       (altsFor(it,def).length?'<button class="btn sm ghost" data-alt="'+ii+'">Gerät besetzt?</button>':"")+
       '<button class="btn sm ghost grow" data-note="'+ii+'">'+((noteFor(it.k)||it.note)?"Notiz ändern":"Notiz")+"</button></div>";
    const nt=noteFor(it.k)||it.note;
    if(nt) h+='<div class="hint">✎ <span>'+esc(nt)+"</span></div>";
    h+="</div>";
  });

  // 3 Cardio
  h+='<div class="step"><span class="no">3</span><h3>Cardio</h3><small class="mute3">nach dem Kraftteil</small></div>';
  h+='<div class="card"><div class="row"><label class="cklab" style="flex:0 0 46px"><input type="checkbox" class="ck" data-tgl="cardio"'+(s.cardio.d?" checked":"")+' aria-label="Cardio erledigt"></label>'+
    '<div class="grow"><div class="num" style="font-weight:600">'+esc(s.cardio.m.charAt(0).toUpperCase()+s.cardio.m.slice(1))+"</div>"+
    '<small class="mute3">Rad, Crosstrainer, Stairmaster oder Laufband mit Steigung</small></div>'+
    '<label class="minibox"><span>Minuten</span><input type="number" inputmode="numeric" min="0" max="120" value="'+(s.cardio.min==null?"":s.cardio.min)+'" data-f="cardio.min" aria-label="Cardio-Minuten"></label></div>';
  h+='<div class="seg" style="margin-top:10px" data-cardio-mode>';
  ["locker","zügig","intervalle"].forEach(m=>h+='<button data-m="'+m+'" aria-pressed="'+(s.cardio.m===m)+'">'+
    m.charAt(0).toUpperCase()+m.slice(1)+((s.cardio.plan||s.cardio.m)===m?" ★":"")+"</button>");
  h+="</div>";
  h+='<small class="mute3" style="display:block;margin-top:7px">★ ist die für diese Einheit vorgesehene Intensität. Du kannst wechseln – die Erklärung darunter passt sich an.</small>';
  const info=CARDIO_INFO[s.cardio.m]||CARDIO_INFO["locker"];
  const cd=c.find(x=>x.m===s.cardio.m);
  const protokoll=(cd&&cd.d)||s.cardio.desc||"";
  h+='<div class="flat" style="margin-top:11px">';
  h+='<div class="spread"><h4>'+esc(s.cardio.m.charAt(0).toUpperCase()+s.cardio.m.slice(1))+'</h4><span class="pill cd">'+esc(info.rpe)+"</span></div>";
  h+='<div style="font-size:13.5px;margin-top:5px">'+esc(info.t)+"</div>";
  if(s.cardio.m==="intervalle" && protokoll)
    h+='<div class="card" style="margin-top:10px;box-shadow:none"><span class="lbl">Protokoll Phase '+s.phase+'</span>'+
       '<div style="font-size:14px;margin-top:3px;font-weight:600">'+esc(protokoll)+"</div></div>";
  h+='<div class="kv" style="margin-top:10px"><b>Sprechtest</b><span>'+esc(info.talk)+"</span></div>";
  h+='<div class="kv"><b>Puls</b><span>'+esc(info.puls)+"</span></div>";
  h+='<div class="kv"><b>Am Gerät</b><span><ul class="ticks" style="margin-top:2px">'+info.how.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></span></div>";
  h+='<div class="kv"><b>Wozu</b><span>'+esc(info.why)+"</span></div>";
  h+='<div class="kv"><b>Bilanz</b><span>'+esc(info.zaehlt)+"</span></div>";
  h+="</div>";
  h+='<small class="mute3" style="display:block;margin-top:9px">Geräte: Rad, Crosstrainer, Stairmaster oder Laufband mit Steigung (gehen, nicht laufen) – alle gelenkschonend. Cardio kommt immer nach dem Krafttraining, nie davor. Warst du an diesem Tag Skifahren, Schwimmen oder Wandern, darf das Gym-Cardio ausfallen – das Krafttraining nicht.</small></div>';

  // 4 Ausklang und Dehnen
  h+='<div class="step"><span class="no">4</span><h3>Ausklang und Dehnen</h3><small class="mute3">3–5 min</small></div>';
  h+='<div class="card"><div class="row"><label class="cklab" style="flex:0 0 46px"><input type="checkbox" class="ck" data-tgl="cool"'+(s.cool.d?" checked":"")+' aria-label="Ausklang erledigt"></label>'+
    '<div class="grow"><div class="num" style="font-weight:600">Locker auslaufen, dann dehnen</div>'+
    '<small class="mute3">Jetzt ist die Muskulatur warm – das ist der beste Moment dafür.</small></div></div>';
  h+='<small class="mute3" style="display:block;margin-top:9px">Je Dehnung 30 Sekunden ruhig halten, Intensität 6–7 von 10: deutliches Ziehen, kein Schmerz. Drei bis vier Positionen reichen. Tippe eine an, dann siehst du die Zeichnung und die Anleitung.</small>';
  h+='<div class="list" style="margin-top:11px">';
  DEHN.forEach(d=>{
    h+='<button class="item" data-dehn="'+esc(d.k)+'"><span class="grow"><span class="t">'+esc(d.n)+'</span><span class="s">'+
      esc(d.z+" · "+d.hold)+'</span></span><span class="chev">›</span></button>';
  });
  h+="</div></div>";

  // Notizen + Abschluss
  h+='<div class="step"><span class="no">5</span><h3>Notizen</h3></div>';
  h+='<div class="card"><textarea data-f="notes" placeholder="Wie lief es? Schlaf, Energie, Schmerzen, Maschinen-Einstellungen …">'+esc(s.notes||"")+"</textarea></div>";
  h+='<div style="margin-top:14px">'+
    (s.done
      ? '<button class="btn big" data-act="reopen">Einheit wieder öffnen</button>'
      : '<button class="btn pri big" data-act="finish">Einheit abschließen</button>')+
    '<button class="btn big ghost danger" data-act="delsession" style="margin-top:8px">Einheit löschen</button>'+
    '<button class="btn big ghost" data-act="diagsend" style="margin-top:8px">Diagnose senden (wenn ein Knopf klemmt)</button></div>';
  h+="</div></div>";
  host.innerHTML=h;
  if(keepScroll) window.scrollTo(0,keepScroll);
  bindTaps(host);
  paintWake();
  drawTimer();
  tickElapsed();
}

function tickElapsed(){
  clearInterval(tickElapsed._i);
  const run=()=>{
    const e=$("#elapsed"); if(!e) return;

let wakeLock=null, wakeState="";
async function wakeOn(){
  if(!("wakeLock" in navigator)){ wakeState="nicht unterstützt"; return wakeState; }
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    wakeState="aktiv";
    wakeLock.addEventListener("release",()=>{ wakeLock=null; if(wakeState==="aktiv") wakeState="pausiert"; paintWake(); });
  }catch(e){ wakeState="abgelehnt"; }
  paintWake(); return wakeState;
}

/* ---- Toene ----
   Beide Spuren entstehen im Browser, es braucht keine Audiodateien.
   wavUrl baut eine WAV-Datei im Speicher und gibt ihre Adresse zurueck. */
function wavUrl(fill, secs, rate){
  rate = rate || 22050;
  const n = Math.round(secs*rate), buf = new ArrayBuffer(44+n*2), v = new DataView(buf);
  const put = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  put(0,"RIFF"); v.setUint32(4,36+n*2,true); put(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  put(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    let s = fill(i/rate, i, n);
    if(!(s>-1)) s = Math.max(-1, s||0);
    if(s>1) s = 1;
    v.setInt16(44+i*2, Math.round(s*32767), true);
  }
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
const AUD = {keep:null, alarm:null};
function audEl(kind){
  if(AUD[kind]) return AUD[kind];
  const a = document.createElement("audio");
  a.setAttribute("playsinline",""); a.preload="auto";
  if(kind==="keep"){
    /* Traegerton: 60 Hz, rund 60 dB unter Vollaussteuerung – nicht hoerbar.
       iOS laesst eine Seite im Hintergrund nur weiterlaufen, solange Ton laeuft. */
    a.loop = true;
    a.src = wavUrl(t => Math.sin(2*Math.PI*60*t)*0.0006, 4);
  } else {
    a.src = wavUrl(t => {
      const pat = [[0,0.20,880],[0.30,0.20,880],[0.60,0.45,660]];
      let s = 0;
      for(const p of pat){
        if(t>=p[0] && t<p[0]+p[1]){
          const u = (t-p[0])/p[1];
          s += Math.sin(2*Math.PI*p[2]*t) * 0.45 * Math.min(1,u*18) * Math.min(1,(1-u)*6);
        }
      }
      return s;
    }, 1.3);
  }
  a.volume = 1;
  document.body.appendChild(a);
  AUD[kind] = a;
  return a;
}
/* Beide Spuren bei der ersten Beruehrung freischalten – sonst verweigert
   iOS spaeter den Ton, der ohne Tippen kommt. */
let audUnlocked = false;
function unlockAudio(){
  if(audUnlocked) return;
  audUnlocked = true;
  ["keep","alarm"].forEach(k=>{
    try{
      const a = audEl(k); a.volume = 0;
      const p = a.play();
      const back = ()=>{ try{ a.pause(); a.currentTime=0; a.volume=1; }catch(e){} };
      if(p && p.then) p.then(back, back); else back();
    }catch(e){}
  });
}
document.addEventListener("pointerdown", unlockAudio, {capture:true});
document.addEventListener("touchstart", unlockAudio, {capture:true, passive:true});

function keepAliveOn(){
  if(S.settings.bg === false) return;

    const a = audEl("keep"); a.volume = 1;
    if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(()=>{}); }
  }catch(e){}
}

/* ---- Pausenuhr ----
   Rechnet nach der Uhrzeit, nicht in Zaehlschritten: die Uhr stimmt also auch,
   wenn das iPhone gesperrt war, du in einer anderen App warst oder die App
   zwischendurch geschlossen wurde. */
const TKEY = "recomp.timer";
let T = {total:0, endsAt:0, paused:false, rest:0, alerted:false, iv:null};

function tLeft(){
  if(!T.total) return 0;
  if(T.paused) return Math.max(0, T.rest);
  return Math.max(0, Math.ceil((T.endsAt-Date.now())/1000));
}
function tSave(){
  try{
    if(!T.total){ localStorage.removeItem(TKEY); return; }
    localStorage.setItem(TKEY, JSON.stringify({total:T.total, endsAt:T.endsAt, paused:T.paused, rest:T.rest, alerted:T.alerted}));
  }catch(e){}
}
function tTick(){
  clearInterval(T.iv); T.iv = null;
  if(!T.total) return;
  T.iv = setInterval(()=>{
    if(!T.paused && !T.alerted && tLeft() <= 0){ T.alerted = true; tSave(); restOver(); }
    drawTimer();
  }, 400);
}
function startTimer(sec){
  T.total = sec; T.rest = sec; T.paused = false; T.alerted = false;
  T.endsAt = Date.now() + sec*1000;
  tSave(); tTick(); keepAliveOn(); drawTimer();
}
function stopTimer(){
  T.total = 0; T.rest = 0; T.endsAt = 0; T.paused = false; T.alerted = false;
  clearInterval(T.iv); T.iv = null;
  tSave(); keepAliveOff(); drawTimer();
}
function pauseTimer(){
  if(!T.total) return;
  if(T.paused){ T.paused = false; T.endsAt = Date.now() + Math.max(0,T.rest)*1000; keepAliveOn(); }
  else { T.rest = tLeft(); T.paused = true; keepAliveOff(); }
  tSave(); drawTimer();
}
function addTimer(sec){
  if(!T.total) return;
  if(T.paused) T.rest = Math.max(0, T.rest) + sec;
  else T.endsAt = Math.max(T.endsAt, Date.now()) + sec*1000;
  T.total = Math.max(T.total, tLeft());
  T.alerted = false;
  tSave(); tTick(); keepAliveOn(); drawTimer();
}
function tRestore(){
  let o = null;
  try{ o = JSON.parse(localStorage.getItem(TKEY) || "null"); }catch(e){}
  if(!o || !o.total) return;
  T.total = o.total; T.endsAt = o.endsAt||0; T.paused = !!o.paused;
  T.rest = o.rest||0; T.alerted = !!o.alerted;
  if(!T.paused && tLeft() <= 0 && (T.alerted || Date.now()-T.endsAt > 20*60000)){ stopTimer(); return; }
  tTick(); drawTimer();
}
function restOver(){
  try{ const a = audEl("alarm"); a.volume = 1; a.currentTime = 0; const p = a.play(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
  beep();
  try{ if(navigator.vibrate) navigator.vibrate([220,110,220,110,320]); }catch(e){}
  notifyRest();
  setTimeout(keepAliveOff, 4000);
}
function notifyRest(){
  try{
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const opt = {body:"Nächster Satz.", tag:"recomp-rest", renotify:true, icon:"icon-192.png", badge:"icon-192.png"};
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(r => r.showNotification("Pause vorbei", opt))
        .catch(()=>{ try{ new Notification("Pause vorbei", opt); }catch(e){} });
    } else { new Notification("Pause vorbei", opt); }
  }catch(e){}
}
function askNotif(){
  if(!("Notification" in window)){
    showText("Mitteilungen","Dieser Browser kennt keine Mitteilungen.\n\nAm iPhone gibt es sie erst, wenn die App über „Zum Home-Bildschirm“ abgelegt und von dort gestartet wurde.");
    return;
  }
  if(Notification.permission === "granted"){ notifyRest(); toast("Mitteilungen sind erlaubt."); return; }
  if(Notification.permission === "denied"){
    showText("Mitteilungen","Mitteilungen sind für diese App abgelehnt.\n\nWieder einschalten:\nEinstellungen › Mitteilungen › Recomp › Mitteilungen erlauben.");
    return;
  }
  try{
    const r = Notification.requestPermission(p => { showSettings(); toast(p==="granted"?"Mitteilungen erlaubt.":"Nicht erlaubt."); });
    if(r && r.then) r.then(p => { showSettings(); toast(p==="granted"?"Mitteilungen erlaubt.":"Nicht erlaubt."); });
  }catch(e){}
}
function drawTimer(){
  const slot = $("#timerSlot"), bar = $("#timerBar");
  setTimeout(bindAll, 0);
  /* In der laufenden Einheit sitzt die Uhr im Kopf der Seite, sonst als
     Leiste ueber der Tab-Leiste – so laeuft sie weiter, wenn du
     zwischendurch im Plan oder im Uebungslexikon nachsiehst. */
  const host = slot || bar;
  if(slot && bar) bar.innerHTML = "";
  if(!host) return;
  if(!T.total){ host.innerHTML = ""; return; }
  const left = tLeft(), m = Math.floor(left/60), s = left%60;
  const over = left <= 0 && !T.paused;
  host.innerHTML ='<div class="tbar"><div class="prog" style="width:'+(T.total?Math.min(100,(1-left/T.total)*100):0)+'%"></div>'+
    '<div><div class="k">'+(over?"Pause vorbei":T.paused?"Angehalten":"Pause")+'</div><div class="t">'+m+":"+String(s).padStart(2,"0")+"</div></div>"+
    '<div class="grow"></div><button data-t="30">+30 s</button>'+
    (over?"":'<button data-t="pause">'+(T.paused?"Weiter":"Stopp")+"</button>")+
    '<button data-t="stop">Fertig</button></div>';
}
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    beep._c=beep._c||new AC();
    const c=beep._c; if(c.state==="suspended") c.resume();
    [0,0.18].forEach((off,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="sine"; o.frequency.value=i?660:880;
      g.gain.setValueAtTime(0.0001,c.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.25,c.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+off+0.16);
      o.connect(g); g.connect(c.destination); o.start(c.currentTime+off); o.stop(c.currentTime+off+0.18);
    });
  }catch(e){}
}
/* Zurueck aus einer anderen App: Uhr sofort nachrechnen. */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState !== "visible" || !T.total) return;
  if(!T.paused && !T.alerted && tLeft() <= 0){ T.alerted = true; tSave(); restOver(); }
  else if(!T.paused && tLeft() > 0) keepAliveOn();
  tTick(); drawTimer();
});
window.addEventListener("pageshow",()=>{ if(T.total){ tTick(); drawTimer(); } });

/* ---- CSV ---- */
function buildCsv(){
  const rows=[["Datum","Wochentag","Woche","Phase","Plan","Übung","Satz","kg","Wdh","RIR","Notiz Übung","Aufwärmen min","Cardio","Cardio min","Notiz Einheit"]];
  Object.values(S.sessions).sort((a,b)=>dayMs(a.date)-dayMs(b.date)).forEach(s=>{
    (s.items||[]).forEach(it=>{
      const ex=EX[it.k]||{n:it.k};
      it.sets.forEach((st,i)=>{
        if(!st.d && st.w==null && st.r==null) return;
        rows.push([s.date,fmtDay(s.date),s.week,s.phase,s.plan,ex.n,i+1,st.w==null?"":st.w,st.r==null?"":st.r,st.rir==null?"":st.rir,it.note||"",
                   s.warm&&s.warm.d?s.warm.min:"",s.cardio&&s.cardio.d?s.cardio.m:"",s.cardio&&s.cardio.d?s.cardio.min:"",s.notes||""]);
      });
    });
  });
  Object.values(S.measures).sort((a,b)=>dayMs(a.date)-dayMs(b.date)).forEach(m=>{
    rows.push([m.date,fmtDay(m.date),"","","","Körperwert","", m.kg==null?"":m.kg,"","",m.note||"","","","",("Taille "+(m.cm==null?"":m.cm)+" cm")]);
  });
  return rows.map(r=>r.map(v=>{const s=String(v==null?"":v);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";")).join("\n");
}

/* ---- Sicherung und Einspielen ----
   Alles liegt nur auf diesem Geraet. Darum: Sicherung herunterladen koennen,
   und sie (oder die Daten aus einer frueheren Fassung) wieder einspielen. */
function dataDump(){
  return {app:"recomp", version:APPVERSION, exportiert:new Date().toISOString(),
          settings:S.settings, sessions:S.sessions, measures:S.measures,
          activity:S.activity, exnotes:S.exnotes};
}
function doBackup(){
  const txt=JSON.stringify(dataDump(),null,1), name="recomp-sicherung-"+todayISO()+".json";
  try{
    const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    toast("Sicherung gespeichert.");
    return;
  }catch(e){}
  showText("Sicherung", txt);
}
function applyImport(o){
  if(!o || typeof o!=="object"){ toast("Das passt nicht – erwartet wird eine Sicherung."); return; }
  let n=0;
  const take=(bag,src)=>{
    Object.keys(src||{}).forEach(id=>{
      const d=src[id]; if(!d||typeof d!=="object") return;
      const mine=bag[id];
      if(!mine || (d.upd||0) >= (mine.upd||0)){ bag[id]=clone(d); n++; }
    });
  };
  take(S.sessions,o.sessions); take(S.measures,o.measures);
  take(S.activity,o.activity); take(S.exnotes,o.exnotes);
  if(o.settings && (o.settings.upd||0) >= (S.settings.upd||0))
    S.settings=Object.assign({},DEF_SETTINGS,clone(o.settings));
  lsSave(); closeOverlay(); render(); if(openSessionId) renderSession();
  toast(n+" Einträge übernommen.");
}
function showImport(){
  const b='<div class="flat"><div style="font-size:13.5px">Hier kommt eine Sicherung zurück – oder der Bestand aus der bisherigen Fassung. Was schon da ist, bleibt; bei gleichem Eintrag gewinnt der neuere.</div></div>'+
    '<label class="field" style="margin-top:12px"><span>Datei wählen</span><input type="file" id="imp-file" accept="application/json,.json"></label>'+
    '<label class="field" style="margin-top:12px"><span>oder Text einfügen</span><textarea id="imp-txt" placeholder="{ … }" style="min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea></label>'+
    '<div style="margin-top:14px"><button class="btn pri big" data-act="impgo">Übernehmen</button></div>';
  $("#overlay").innerHTML=pane("Daten einspielen","Sicherung oder Umzug",b); bindAll();
  const f=$("#imp-file");
  if(f) f.addEventListener("change",()=>{
    const file=f.files&&f.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ applyImport(JSON.parse(String(rd.result))); }catch(e){ toast("Die Datei ist kein gültiges JSON."); } };
    rd.onerror=()=>toast("Die Datei lässt sich nicht lesen.");
    rd.readAsText(file);
  });
}
